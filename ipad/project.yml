# XcodeGen project for the VoltaDock iPad companion. Never edit the generated
# .xcodeproj by hand: run `xcodegen` in this folder.
name: VoltaDockPad
options:
  bundleIdPrefix: io.github.diegovolta91
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  VoltaDockPad:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_NAME: VoltaDock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: io.github.diegovolta91.VoltaDock.iPad
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: VoltaDock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: io.github.diegovolta91.VoltaDock.pair
            CFBundleURLSchemes:
              - voltadock
        NSLocalNetworkUsageDescription: VoltaDock se conecta a tu ordenador en la red local para mostrar tus sesiones de Claude Code y responder permisos.
        NSCameraUsageDescription: La cámara solo se usa para escanear el código de emparejado que muestra VoltaDock en tu ordenador.
    scheme:
      testTargets:
        - VoltaDockPadTests
  VoltaDockPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: VoltaDockPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.diegovolta91.VoltaDock.iPadTests
        # The app's product name is VoltaDock, not the target name XcodeGen assumes.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VoltaDock.app/VoltaDock
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
